<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Blood Ransom</title>
<style>
:root{--cyan:#16f6ff;--blue:#3874ff;--mag:#ff28d7;--red:#ff365f;--gold:#ffe06a;--ink:#02040d;--panel:#071128ee;--line:#1abff0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dffcff;font:16px/1.35 "Trebuchet MS",Arial,sans-serif;touch-action:none}button,input{font:inherit;color:inherit}button{cursor:pointer}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,#0000 0 3px,#0004 4px);mix-blend-mode:overlay}
#app{position:relative;width:100%;height:100%;max-width:1440px;margin:auto;background:radial-gradient(circle at 50% 35%,#08275c 0,#030817 40%,#000 76%)}
.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.glow{text-shadow:0 0 5px currentColor,0 0 14px currentColor,0 0 30px currentColor}.panel{border:2px solid var(--cyan);background:linear-gradient(145deg,#071733ee,#030713f5);box-shadow:0 0 8px var(--cyan),inset 0 0 20px #143a7c88;border-radius:8px}.btn{border:1px solid var(--cyan);background:#081633;padding:.7rem 1rem;text-transform:uppercase;letter-spacing:.12em;box-shadow:0 0 8px #16f6ff88,inset 0 0 10px #143a7c;color:#eaffff}.btn:hover,.btn:focus{background:#16336e;outline:1px solid white;transform:translateY(-1px)}.btn.mag{border-color:var(--mag);box-shadow:0 0 8px #ff28d788}.muted{color:#7d9fbe}.gold{color:var(--gold)}
/* Title and story */
#title{align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.logo{font-size:clamp(2.4rem,8vw,6.5rem);font-weight:900;letter-spacing:.06em;text-align:center;color:#f5ffff;text-shadow:0 0 3px white,0 0 12px var(--cyan),0 0 35px var(--blue),8px 8px 0 #c5009f;transform:skew(-5deg);z-index:2}.logo small{display:block;font-size:.18em;letter-spacing:.7em;color:var(--red);text-shadow:0 0 10px var(--red)}.title-grid{position:absolute;width:150%;height:70%;bottom:-26%;background:repeating-linear-gradient(90deg,#0ff5 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,#0ff5 0 2px,transparent 2px 60px);transform:perspective(350px) rotateX(62deg);filter:drop-shadow(0 0 5px #0ff);animation:grid 3s linear infinite}@keyframes grid{to{background-position:0 60px}}.title-actions{z-index:2;display:grid;gap:10px;margin-top:6vh;min-width:250px}.version{position:absolute;bottom:12px;color:#517e9c;font-size:.75rem}
#nameScreen,#story{align-items:center;justify-content:center;padding:20px}.modal{width:min(720px,94vw);padding:clamp(18px,4vw,42px)}h2{margin:.1em 0 .7em;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase}.namebox{width:100%;background:#01040c;border:0;border-bottom:2px solid var(--mag);font-size:2rem;padding:12px;text-align:center;text-transform:uppercase;outline:none;box-shadow:0 8px 10px -10px var(--mag)}.dialogue{min-height:160px;font-size:clamp(1rem,2.5vw,1.25rem)}.speaker{color:var(--mag);font-weight:bold;text-transform:uppercase;letter-spacing:.1em}.dialogue-next{float:right;margin-top:18px}
/* Map */
#map{flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:12px;padding:8px 13px;min-height:55px}.topbar .grow{flex:1}.resource{white-space:nowrap}.maparea{position:relative;flex:1;margin-top:10px;overflow:hidden;background:radial-gradient(ellipse at center,#0b2452 0,#020713 65%);border:1px solid #14658d;box-shadow:inset 0 0 50px #000}.maparea:before{content:"";position:absolute;inset:0;background:linear-gradient(30deg,#0ff1 12%,transparent 12.5%,transparent 87%,#0ff1 87.5%),linear-gradient(150deg,#0ff1 12%,transparent 12.5%,transparent 87%,#0ff1 87.5%);background-size:70px 120px}.roads{position:absolute;inset:0;opacity:.45;background:linear-gradient(25deg,transparent 47%,#0ff 48% 49%,transparent 50%),linear-gradient(-30deg,transparent 47%,#f0f 48% 49%,transparent 50%)}.node{position:absolute;transform:translate(-50%,-50%);width:clamp(88px,17vw,170px);min-height:58px;border:2px solid var(--cyan);border-radius:50%;background:#06142bea;color:white;box-shadow:0 0 10px var(--cyan),inset 0 0 16px #066;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:bold;padding:8px;transition:.2s}.node:hover{transform:translate(-50%,-50%) scale(1.08)}.node.locked{filter:grayscale(1);opacity:.5}.node.shop{border-color:var(--mag);box-shadow:0 0 10px var(--mag),inset 0 0 16px #606}.node small{display:block;color:#9ed3df;font-size:.7rem;font-weight:normal}.maphint{text-align:center;padding:5px;color:#8bb4c7;font-size:.8rem}
/* Game */
#game{background:#000;flex-direction:column}.hud{height:88px;display:flex;gap:8px;padding:8px;background:#020817dd;border-bottom:2px solid #1989bf;z-index:4}.portrait{width:64px;border:1px solid var(--mag);background:linear-gradient(135deg,#42105d,#071938);display:grid;place-items:center;font-size:2rem;box-shadow:inset 0 0 15px #f0f7}.hudinfo{min-width:160px;flex:1}.hudname{font-weight:bold;letter-spacing:.1em}.bar{height:12px;margin-top:5px;background:#01030a;border:1px solid #34708a;position:relative}.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#bf123f,#ff426b);box-shadow:0 0 8px #f24}.bar.mp i{background:linear-gradient(90deg,#0958d8,#18e7ff);box-shadow:0 0 8px #0ff}.hudstats{text-align:right;color:#b9e9f3;font-size:.8rem}.areaName{position:absolute;top:102px;left:50%;transform:translateX(-50%);z-index:6;padding:5px 16px;background:#000b;border-bottom:1px solid var(--cyan);letter-spacing:.25em;text-transform:uppercase;pointer-events:none}canvas{display:block;width:100%;height:calc(100% - 88px);image-rendering:auto}.touch{display:none;position:absolute;inset:auto 0 max(10px,env(safe-area-inset-bottom));height:190px;pointer-events:none;z-index:10}.touch button{pointer-events:auto;position:absolute;border:2px solid #7ff9;background:#05142bbb;color:white;box-shadow:0 0 8px #0ff8,inset 0 0 13px #0ff3;font-weight:bold;user-select:none}.dpad button{width:62px;height:62px;border-radius:10px}.up{left:75px;bottom:114px}.down{left:75px;bottom:0}.left{left:12px;bottom:57px}.right{left:138px;bottom:57px}.action{width:68px;height:68px;border-radius:50%}.atk{right:18px;bottom:28px;border-color:#ff397f!important}.magic{right:92px;bottom:103px;border-color:#f3f!important}.jump{right:118px;bottom:4px}.menuTouch{right:14px;bottom:120px;width:55px;height:38px;border-radius:8px}
/* Menus */
#menu,#shop,#save{align-items:center;justify-content:center;padding:10px;background:#000a;z-index:30}.menuwrap{width:min(960px,96vw);height:min(650px,94vh);display:grid;grid-template-columns:220px 1fr;overflow:hidden}.tabs{padding:12px;border-right:2px solid #167da0;display:flex;flex-direction:column;gap:8px}.tabs button{text-align:left}.content{padding:18px;overflow:auto}.partycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.charcard{padding:12px;border:1px solid #296482;background:#051025}.charcard.activechar{border-color:var(--mag);box-shadow:0 0 8px #f0f}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.list{display:grid;gap:8px}.listitem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #245978;background:#06132b}.listitem .desc{flex:1}.listitem.locked{opacity:.45}.pill{font-size:.7rem;padding:2px 6px;border:1px solid var(--cyan);border-radius:8px}.shopwrap,.savewrap{width:min(850px,96vw);max-height:92vh;padding:18px;overflow:auto}.toast{position:absolute;z-index:80;left:50%;top:16%;transform:translate(-50%,-30px);opacity:0;background:#030817e8;border:1px solid var(--cyan);padding:12px 22px;box-shadow:0 0 15px var(--cyan);transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(pointer:coarse),(max-width:800px){.touch{display:block}.hud{height:76px}.portrait{width:48px;font-size:1.5rem}.hudstats{font-size:.67rem}.areaName{top:82px;font-size:.7rem}.menuwrap{grid-template-columns:1fr;height:96vh}.tabs{border-right:0;border-bottom:2px solid #167da0;flex-direction:row;overflow-x:auto}.tabs .btn{padding:.5rem;font-size:.7rem}.content{padding:10px}.node{font-size:.72rem}.topbar{font-size:.75rem}.topbar .btn{padding:.5rem}.resource:nth-of-type(2){display:none}}
@media(max-height:580px) and (orientation:landscape){.touch{height:150px}.dpad button{width:50px;height:50px}.up{left:62px;bottom:96px}.down{left:62px}.left{left:12px;bottom:48px}.right{left:112px;bottom:48px}.action{width:56px;height:56px}.magic{right:75px;bottom:82px}.jump{right:88px}.menuTouch{bottom:98px}}
</style>
</head>
<body><main id="app">
<section id="title" class="screen active"><div class="title-grid"></div><div class="logo">NEON BLOOD<small>RANSOM</small></div><div class="title-actions"><button class="btn" onclick="newGame()">New Game</button><button class="btn mag" onclick="openSave('load')">Load Game</button></div><div class="version">GRIDHAVEN // SIGNAL 1.0</div></section>
<section id="nameScreen" class="screen"><div class="modal panel"><h2>Warden Registry</h2><p>The bloodline remembers. What name shall the city whisper?</p><input id="nameInput" class="namebox" maxlength="12" value="VESPER" autocomplete="off"><br><br><button class="btn mag" onclick="confirmName()">Bind the Name</button></div></section>
<section id="story" class="screen"><div class="modal panel"><div class="dialogue"><div id="speaker" class="speaker"></div><p id="storyText"></p></div><button class="btn dialogue-next" onclick="nextStory()">Continue ▸</button></div></section>
<section id="map" class="screen"><div class="topbar panel"><b id="mapName" class="glow">VESPER</b><span class="grow"></span><span class="resource gold">◈ <b id="mapCredits">0</b></span><span class="resource">LV <b id="mapLevel">1</b></span><button class="btn" onclick="openMenu()">Status</button><button class="btn mag" onclick="openSave('save')">Save</button></div><div class="maparea"><div class="roads"></div><button class="node" style="left:15%;top:28%" onclick="travel('home')">⌂ HOME<small>rest • story • save</small></button><button class="node" style="left:39%;top:44%" onclick="travel('downtown')">DOWNTOWN<small>danger: low</small></button><button class="node shop" style="left:65%;top:22%" onclick="travel('market')">NEON MARKET<small>shopping district</small></button><button class="node" style="left:73%;top:62%" onclick="travel('alley')">ALLEY GRID<small>danger: medium</small></button><button id="sewerNode" class="node locked" style="left:40%;top:77%" onclick="travel('sewers')">UNDERGRID<small id="sewerLabel">signal locked</small></button></div><div class="maphint">Select any open district • ESC / Menu opens Warden status</div></section>
<section id="game" class="screen"><div class="hud"><div class="portrait">🧛</div><div class="hudinfo"><div class="hudname" id="hudName">VESPER <span class="muted">LV 1</span></div><div class="bar"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div></div><div class="hudstats"><div>HP <span id="hptext"></span></div><div>BP <span id="mptext"></span></div><div class="gold">◈ <span id="gameCredits"></span></div><div>JP <span id="gameJP"></span></div></div></div><div id="areaName" class="areaName glow"></div><canvas id="canvas"></canvas><div class="touch"><div class="dpad"><button class="up" data-key="up">▲</button><button class="down" data-key="down">▼</button><button class="left" data-key="left">◀</button><button class="right" data-key="right">▶</button></div><button class="action atk" data-key="attack">Z<br>HIT</button><button class="action magic" data-key="special">X<br>BLOOD</button><button class="action jump" data-key="jump">C<br>JUMP</button><button class="menuTouch" data-key="menu">MENU</button></div></section>
<section id="menu" class="screen"><div class="menuwrap panel"><nav class="tabs"><button class="btn" onclick="menuPage('status')">Party</button><button class="btn" onclick="menuPage('equip')">Equip</button><button class="btn" onclick="menuPage('arts')">Blood Arts</button><button class="btn" onclick="menuPage('moves')">Learn Moves</button><button class="btn mag" onclick="closeMenu()">Return</button></nav><div id="menuContent" class="content"></div></div></section>
<section id="shop" class="screen"><div class="shopwrap panel"><h2 id="shopTitle">Neon Market</h2><div id="shopContent"></div><br><button class="btn mag" onclick="closeShop()">Return to Map</button></div></section>
<section id="save" class="screen"><div class="savewrap panel"><h2 id="saveTitle">Memory Crypt</h2><div id="saveContent" class="list"></div><br><button class="btn mag" onclick="closeSave()">Cancel</button></div></section>
<div id="toast" class="toast"></div>
</main>
<script>
/* NEON BLOOD RANSOM — a dependency-free canvas brawler. */
const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];
const C=$('#canvas'),ctx=C.getContext('2d'); let W=0,H=0,last=0,gameRunning=false,previousScreen='map',storyStep=0,saveMode='save';
const keys={}, particles=[],floaters=[],enemies=[],companions=[];
const zones={
 downtown:{name:'Downtown Streets',theme:'#16f6ff',length:2700,danger:1,bg:'SKYLINE 09'},
 alley:{name:'The Alley Grid',theme:'#ff28d7',length:3100,danger:2,bg:'NULL SECTOR'},
 sewers:{name:'Undergrid Sewers',theme:'#42ff85',length:3500,danger:3,bg:'LOWER GRID'}
};
const items={
 fists:{name:'Warden Fists',slot:'weapon',atk:0,price:0,desc:'Ancient technique. Always equipped.'},
 neonKnucks:{name:'Neon Knuckles',slot:'weapon',atk:4,price:90,desc:'+4 ATK • cyan impact trails'},
 bloodSaber:{name:'Blood Saber',slot:'weapon',atk:8,price:240,desc:'+8 ATK • crimson arc'},
 mesh:{name:'Night Mesh',slot:'armor',def:3,price:100,desc:'+3 DEF • woven lightmail'},
 wardenCoat:{name:'Warden Coat',slot:'armor',def:7,price:260,desc:'+7 DEF • ceremonial armor'},
 fang:{name:'Signal Fang',slot:'accessory',maxHp:18,price:120,desc:'+18 maximum HP'},
 prism:{name:'Blood Prism',slot:'accessory',maxMp:15,price:180,desc:'+15 maximum BP'}
};
const arts={burst:{name:'Crimson Burst',cost:12,power:2.3,desc:'A close-range blood shockwave.'},lance:{name:'Night Lance',cost:18,power:3.1,desc:'A piercing wave across the street.'},veil:{name:'Sanguine Veil',cost:22,power:0,desc:'Restore HP with forbidden blood.'}};
const moveDefs={upper:{name:'Grave Uppercut',jp:8,desc:'Up + Attack launches enemies.'},dash:{name:'Photon Rush',jp:14,desc:'Double-tap direction to dash.'},nova:{name:'Blood Nova',jp:22,desc:'Unlock Night Lance blood art.'},veil:{name:'Sanguine Veil',jp:28,desc:'Unlock healing blood art.'}};
function baseState(name='VESPER'){return{name,level:1,xp:0,nextXp:80,jp:0,credits:60,hp:100,mp:50,baseMaxHp:100,baseMaxMp:50,atk:10,def:3,inventory:['fists'],equip:{weapon:'fists',armor:null,accessory:null},arts:['burst'],moves:[],party:[{id:'vesper',name,role:'Night Warden',level:1}],flags:{sewers:false,nyx:false,bram:false,ix:false,boss:false,kills:0},zone:null,x:180,y:0}}let S=baseState();
function show(id){screens.forEach(x=>x.classList.toggle('active',x.id===id))}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1800)}
function newGame(){show('nameScreen');setTimeout(()=>$('#nameInput').focus(),100)}
function confirmName(){let n=$('#nameInput').value.trim().replace(/[^a-z0-9 _-]/gi,'').slice(0,12)||'VESPER';S=baseState(n.toUpperCase());storyStep=0;show('story');nextStory()}
const intro=[
 ['THE ARCHIVIST','Gridhaven was built above an ancient hunger. Vampires chained that hunger—and became the city’s Night Wardens.'],
 ['THE ARCHIVIST','Then came the Corrupted Signal. The dead rose in electric skin. Wolves learned the language of circuits. The lower grid went dark.'],
 ['MOTHER NOCTIS','You are young, {NAME}. But tonight, youth is a luxury. Reclaim our streets. Find the lost Wardens. Follow the bloodline home.'],
 ['{NAME}','Then light the grid. I’m going hunting.']];
function nextStory(){if(storyStep>=intro.length){show('map');refreshMap();autoSave();return}let [sp,tx]=intro[storyStep++];$('#speaker').textContent=sp.replace('{NAME}',S.name);$('#storyText').textContent=tx.replace('{NAME}',S.name)}
function refreshMap(){calcStats();$('#mapName').textContent=S.name;$('#mapCredits').textContent=S.credits;$('#mapLevel').textContent=S.level;$('#sewerNode').classList.toggle('locked',!S.flags.sewers);$('#sewerLabel').textContent=S.flags.sewers?'danger: high':'defeat 8 corrupted'}
function travel(z){if(z==='home'){S.hp=maxHp();S.mp=maxMp();if(S.flags.kills>=3&&!S.flags.nyx)recruit('nyx','NYX','Hexblade','“You hit like an alarm bell. I like it.” Nyx joins the hunt.');else toast('Rested beneath the Blood Moon • fully recovered');refreshMap();autoSave();return}if(z==='market'){openShop();return}if(z==='sewers'&&!S.flags.sewers){toast('The Undergrid signal is still encrypted');return}enterZone(z)}
function maxHp(){return S.baseMaxHp+(S.equip.accessory==='fang'?18:0)}function maxMp(){return S.baseMaxMp+(S.equip.accessory==='prism'?15:0)}function attackStat(){return S.atk+(items[S.equip.weapon]?.atk||0)}function defense(){return S.def+(items[S.equip.armor]?.def||0)}function calcStats(){S.hp=Math.min(S.hp,maxHp());S.mp=Math.min(S.mp,maxMp())}
function recruit(id,name,role,line){S.flags[id]=true;S.party.push({id,name,role,level:S.level});show('story');$('#speaker').textContent=name;$('#storyText').textContent=line;storyStep=intro.length;setTimeout(()=>{show('map');refreshMap()},3300);toast(name+' joined the party!');autoSave()}
function enterZone(z){S.zone=z;S.x=160;S.y=0;enemies.length=0;companions.length=0;S.party.slice(1).forEach((p,i)=>companions.push({name:p.name,x:90-i*45,y:30+i*28,hp:70,color:['#ff28d7','#ffe06a','#42ff85'][i]}));spawnWave(600,4+zones[z].danger);show('game');gameRunning=true;resize();updateHUD();$('#areaName').textContent=zones[z].name;setTimeout(()=>$('#areaName').style.opacity=.2,1800);last=performance.now();requestAnimationFrame(loop)}
function spawnWave(start,count){for(let i=0;i<count;i++){let types=S.zone==='sewers'?['zombie','spider','bat','brute']:S.zone==='alley'?['zombie','wolf','bat']:['zombie','wolf'];let type=types[i%types.length],elite=(i===count-1&&zones[S.zone].danger>1);enemies.push({type,x:start+i*250+Math.random()*120,y:(Math.random()-.5)*170,hp:(elite?70:30)+zones[S.zone].danger*12,max:1,atk:5+zones[S.zone].danger*3,w:type==='brute'?48:32,h:type==='bat'?24:46,color:type==='zombie'?'#57ff95':type==='wolf'?'#ff4f83':type==='bat'?'#b36cff':'#ffe14b',vx:0,hit:0,dead:false,elite});enemies.at(-1).max=enemies.at(-1).hp}}
function resize(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;C.width=W*d;C.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);
function updateHUD(){calcStats();$('#hudName').innerHTML=S.name+' <span class="muted">LV '+S.level+'</span>';$('#hpbar').style.width=100*S.hp/maxHp()+'%';$('#mpbar').style.width=100*S.mp/maxMp()+'%';$('#hptext').textContent=Math.ceil(S.hp)+' / '+maxHp();$('#mptext').textContent=Math.ceil(S.mp)+' / '+maxMp();$('#gameCredits').textContent=S.credits;$('#gameJP').textContent=S.jp}
let player={vy:0,z:0,facing:1,attack:0,cool:0,inv:0,combo:0,comboT:0,special:0,shake:0};
function loop(t){if(!gameRunning)return;let dt=Math.min((t-last)/16.667,2);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){player.cool=Math.max(0,player.cool-dt);player.inv=Math.max(0,player.inv-dt);player.attack=Math.max(0,player.attack-dt);player.special=Math.max(0,player.special-dt);player.comboT-=dt;if(player.comboT<0)player.combo=0;let speed=4.2;if(keys.left){S.x-=speed*dt;player.facing=-1}if(keys.right){S.x+=speed*dt;player.facing=1}if(keys.up)S.y-=3*dt;if(keys.down)S.y+=3*dt;S.y=Math.max(-H*.19,Math.min(H*.19,S.y));S.x=Math.max(50,Math.min(zones[S.zone].length,S.x));if(player.z>0||player.vy>0){player.z+=player.vy*dt;player.vy-=.75*dt;if(player.z<=0){player.z=0;player.vy=0}}if(keys.attack&&player.cool<=0)doAttack();if(keys.special&&player.cool<=0)castArt(S.arts[0]);if(keys.jump&&player.z===0){player.vy=11;player.z=1;keys.jump=false}
 for(let e of enemies){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);let dx=S.x-e.x,dy=S.y-e.y,dist=Math.hypot(dx,dy);if(dist<390){e.x+=Math.sign(dx)*Math.min(1.55+zones[S.zone].danger*.15,Math.abs(dx))*dt;e.y+=Math.sign(dy)*Math.min(.7,Math.abs(dy))*dt}if(dist<42&&e.hit<=0&&player.inv<=0&&player.z<12){let dmg=Math.max(1,e.atk-defense()+Math.floor(Math.random()*4));S.hp-=dmg;player.inv=34;player.shake=10;floater('-'+dmg,S.x,S.y-35,'#ff3b67');e.hit=20;updateHUD();if(S.hp<=0){S.hp=Math.ceil(maxHp()*.45);S.credits=Math.max(0,S.credits-20);exitZone('The signal overwhelms you. Mother Noctis pulls you home.');return}}}
 for(let c of companions){let target=enemies.filter(e=>!e.dead).sort((a,b)=>Math.abs(a.x-c.x)-Math.abs(b.x-c.x))[0];if(target){let dx=target.x-c.x,dy=target.y-c.y;if(Math.abs(dx)>42)c.x+=Math.sign(dx)*2.3*dt;if(Math.abs(dy)>15)c.y+=Math.sign(dy)*1.3*dt;c.cd=(c.cd||0)-dt;if(Math.hypot(dx,dy)<52&&c.cd<=0){damageEnemy(target,6+S.level*2,c.x,c.y);c.cd=35}}else{c.x+=(S.x-60-c.x)*.04*dt;c.y+=(S.y-c.y)*.04*dt}}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.03*dt;p.life-=dt});for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);floaters.forEach(f=>{f.y-=.65*dt;f.life-=dt});for(let i=floaters.length-1;i>=0;i--)if(floaters[i].life<=0)floaters.splice(i,1);

function doAttack(){player.combo=player.combo%3+1;player.comboT=35;player.attack=12;player.cool=player.combo===3?20:11;let range=player.combo===3?90:67,hit=false;for(let e of enemies){if(e.dead)continue;let dx=(e.x-S.x)*player.facing;if(dx>-15&&dx<range&&Math.abs(e.y-S.y)<48){let dmg=Math.round((attackStat()+Math.random()*5)*(player.combo===3?1.65:1));damageEnemy(e,dmg,S.x,S.y);e.x+=player.facing*(player.combo===3?65:25);hit=true}}if(hit)player.shake=player.combo===3?8:3}

function draw(){let z=zones[S.zone],cam=Math.max(0,Math.min(z.length-W,S.x-W*.34)),sx=S.x-cam,ground=H*.62,sh=player.shake;ctx.save();ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);ctx.fillStyle='#01030a';ctx.fillRect(-20,-20,W+40,H+40);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#020817');grad.addColorStop(.65,'#071128');grad.addColorStop(1,'#02050a');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 // area signage and exit marker
 ctx.fillStyle=z.theme;ctx.font='bold 18px monospace';ctx.fillText(z.bg,70-cam*.15,ground-115);let exit=zones[S.zone].length-cam;ctx.strokeStyle='#fff';ctx.shadowBlur=15;ctx.shadowColor=z.theme;ctx.strokeRect(exit-40,ground-125,70,125);ctx.fillStyle='#fff';ctx.fillText('EXIT',exit-31,ground-140);ctx.shadowBlur=0;
 let actors=[...enemies.filter(e=>!e.dead).map(e=>({...e,kind:'enemy'})),...companions.map(c=>({...c,kind:'comp'})),{x:S.x,y:S.y,kind:'player'}].sort((a,b)=>a.y-b.y);for(let a of actors){let x=a.x-cam,y=ground+a.y;if(a.kind==='player')drawFighter(x,y,S.name,'#16f6ff',true);else if(a.kind==='comp')drawFighter(x,y,a.name,a.color,false);else drawEnemy(a,x,y)}

function drawFighter(x,y,name,color,isPlayer){let jump=isPlayer?player.z:0,flash=isPlayer&&player.inv>0&&Math.floor(player.inv/3)%2; if(flash)return;ctx.save();ctx.translate(x,y-jump);ctx.shadowBlur=14;ctx.shadowColor=color;ctx.strokeStyle=color;ctx.lineWidth=4;ctx.fillStyle='#050816';ctx.beginPath();ctx.arc(0,-48,13,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(0,-6);ctx.lineTo(-13,13);ctx.moveTo(0,-7);ctx.lineTo(14,13);ctx.moveTo(0,-28);let punch=isPlayer&&player.attack>0?player.facing*30:player.facing*13;ctx.lineTo(punch,-19);ctx.moveTo(0,-28);ctx.lineTo(-player.facing*12,-14);ctx.stroke();ctx.fillStyle=color;ctx.shadowBlur=5;ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText(name,x>W?'':name,0,-70);if(isPlayer&&player.special>0){ctx.strokeStyle='#ff28d7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-22,50-(player.special*1.3),0,Math.PI*2);ctx.stroke()}ctx.restore()}

/* Final-Fantasy-style menus */
function openMenu(){previousScreen=$('#game').classList.contains('active')?'game':'map';gameRunning=false;show('menu');menuPage('status')}
function closeMenu(){show(previousScreen);if(previousScreen==='game'){gameRunning=true;last=performance.now();requestAnimationFrame(loop)}else refreshMap()}

function equip(id){S.equip[items[id].slot]=id;calcStats();menuPage('equip');toast(items[id].name+' equipped');autoSave()}function setArt(id){S.arts=S.arts.filter(x=>x!==id);S.arts.unshift(id);menuPage('arts');toast(arts[id].name+' readied')}
function learnMove(id){let m=moveDefs[id];if(S.moves.includes(id))return;if(S.jp<m.jp){toast('Not enough JP');return}S.jp-=m.jp;S.moves.push(id);if(id==='nova'&&!S.arts.includes('lance'))S.arts.push('lance');if(id==='veil'&&!S.arts.includes('veil'))S.arts.push('veil');menuPage('moves');toast(m.name+' learned!');autoSave()}
function openShop(){show('shop');$('#shopContent').innerHTML='<p>Welcome to <b class="gold">MARA’S NIGHT BAZAAR</b>. The market is protected territory—no corrupted, no bloodshed.</p><p>Credits: <b class="gold">◈ '+S.credits+'</b></p><div class="list">'+Object.entries(items).filter(([id,it])=>it.price>0).map(([id,it])=>`<button class="listitem btn ${S.inventory.includes(id)?'locked':''}" onclick="buy('${id}')"><span class="desc"><b>${it.name}</b><br><small>${it.desc}</small></span><span class="gold">${S.inventory.includes(id)?'OWNED':'◈ '+it.price}</span></button>`).join('')+'</div>'}
function buy(id){let it=items[id];if(S.inventory.includes(id))return;if(S.credits<it.price){toast('Not enough credits');return}S.credits-=it.price;S.inventory.push(id);toast(it.name+' acquired');openShop();autoSave()}function closeShop(){show('map');refreshMap()}
/* Three slots plus autosave. Data is defensive-copied and version tolerant. */
function snapshot(){return JSON.parse(JSON.stringify(S))}function autoSave(){try{localStorage.setItem('nbr_auto',JSON.stringify(snapshot()))}catch(e){}}
function openSave(mode){saveMode=mode;previousScreen=$('#title').classList.contains('active')?'title':'map';show('save');$('#saveTitle').textContent=mode==='save'?'Memory Crypt — Save':'Memory Crypt — Load';renderSaves()}
function renderSaves(){let html='';['auto','1','2','3'].forEach(slot=>{let raw=localStorage.getItem('nbr_'+slot),d=null;try{d=JSON.parse(raw)}catch(e){}let label=slot==='auto'?'AUTOSAVE':'SLOT '+slot;html+=`<button class="listitem btn" onclick="${d?`useSave('${slot}')`:saveMode==='save'&&slot!=='auto'?`writeSave('${slot}')`:''}"><span class="desc"><b>${label}</b><br><small>${d?`${d.name} • LV ${d.level} • ${d.flags?.kills||0} shattered`:'EMPTY'}</small></span>${d&&saveMode==='save'&&slot!=='auto'?`<span onclick="event.stopPropagation();writeSave('${slot}')" class="pill">OVERWRITE</span>`:''}</button>`});$('#saveContent').innerHTML=html}
function writeSave(slot){localStorage.setItem('nbr_'+slot,JSON.stringify(snapshot()));toast('Memory sealed in Slot '+slot);renderSaves()}
function useSave(slot){let d;try{d=JSON.parse(localStorage.getItem('nbr_'+slot))}catch(e){}if(!d)return;if(saveMode==='save'&&slot!=='auto'){writeSave(slot);return}S=Object.assign(baseState(),d);S.flags=Object.assign(baseState().flags,d.flags||{});calcStats();show('map');refreshMap();toast('Memory restored')}
function closeSave(){show(previousScreen);if(previousScreen==='map')refreshMap()}

const keymap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',z:'attack',Z:'attack',x:'special',X:'special',c:'jump',C:'jump',' ':'jump'};
addEventListener('keydown',e=>{if(keymap[e.key]){keys[keymap[e.key]]=true;e.preventDefault()}if(e.key==='Escape'){$('#game').classList.contains('active')||$('#map').classList.contains('active')?openMenu():$('#menu').classList.contains('active')&&closeMenu()}});addEventListener('keyup',e=>{if(keymap[e.key])keys[keymap[e.key]]=false});
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;if(k==='menu'){b.addEventListener('pointerdown',()=>openMenu());return}let on=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
